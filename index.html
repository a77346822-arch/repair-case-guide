<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>정비 사례 가이드</title>
<style>
:root{
  color-scheme: light only;
  --blue:#1b4fd8;
  --blue-dark:#0f2f8a;
  --dark:#1c2230;
  --bg:#ffffff;
  --card:#ffffff;
  --line:#e2e6ef;
  --text:#1c2230;
  --sub:#6b7280;
  --radius:14px;
}
*{box-sizing:border-box;}
html{
  background:#ffffff;
}
body{
  margin:0;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
header.top{
  max-width:1800px;
  margin:0 auto;
  padding:24px 20px 0;
  text-align:center;
}
header.top h1{
  font-size:26px;
  margin:0 0 6px;
}
header.top p{
  color:var(--sub);
  margin:0 0 18px;
  font-size:14px;
}
.banner{
  max-width:1800px;
  margin:0 auto 28px;
  padding:0 20px;
}
.banner img{
  width:100%;
  height:auto;
  display:block;
  border-radius:var(--radius);
  box-shadow:0 6px 24px rgba(20,30,60,.10);
}
main{
  max-width:1800px;
  margin:0 auto;
  padding:0 20px 60px;
}
.panels{
  display:flex;
  gap:20px;
  align-items:stretch;
  justify-content:center;
}
@media (max-width:800px){
  .panels{flex-direction:column; align-items:stretch;}
}
.panel{
  position:relative;
  flex:1 1 0;
  min-width:0;
  width:100%;
  line-height:0; /* remove inline-img gap */
}
.panel img{
  width:100%;
  height:auto;
  display:block;
}
.hotspots{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}
.hotspot{
  position:absolute;
  background:transparent;
  border:none;
  border-radius:6px;
  cursor:pointer;
  padding:0;
  transition:background .12s ease, box-shadow .12s ease;
}
.hotspot:hover, .hotspot:focus-visible{
  background:rgba(27,79,216,.10);
  box-shadow:inset 0 0 0 2px rgba(27,79,216,.45);
  outline:none;
}
/* Detail view */
#detail{
  display:none;
  max-width:900px;
  margin:0 auto;
  padding:24px 20px 60px;
}
.back-row{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}
.back-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:none;
  border:1px solid var(--line);
  border-radius:20px;
  padding:8px 16px;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  font-family:inherit;
  margin-bottom:20px;
}
.back-row .back-btn{margin-bottom:0;}
.back-btn:hover{border-color:var(--blue);color:var(--blue);}
.detail-head{
  margin-bottom:22px;
}
.detail-head .eyebrow{
  font-size:13px;
  color:var(--blue);
  font-weight:700;
  margin-bottom:2px;
}
.detail-head h2{
  margin:0;
  font-size:24px;
}
.case-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.case-item{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px;
  cursor:pointer;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.case-item:hover{
  border-color:var(--blue);
  box-shadow:0 4px 14px rgba(20,30,60,.08);
}
.case-item .c-title{
  font-size:15px;
  font-weight:600;
}
.case-item .c-date{
  font-size:12px;
  color:var(--sub);
  margin-top:4px;
}
.model-code{
  color:var(--blue);
  font-weight:700;
}
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--sub);
  border:1px dashed var(--line);
  border-radius:var(--radius);
  font-size:14px;
  line-height:1.7;
}
.empty b{color:var(--text);}
/* Case detail modal-ish view */
#caseDetail{
  display:none;
  max-width:800px;
  margin:0 auto;
  padding:24px 20px 60px;
}
.case-body{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
}
.case-body h3{
  margin-top:0;
  font-size:20px;
}
.case-body .meta{
  font-size:13px;
  color:var(--sub);
  margin-bottom:16px;
}
.case-body .target-models{
  font-size:14px;
  margin-bottom:16px;
}
.case-body .target-models .label{
  display:block;
  color:var(--sub);
  margin-bottom:6px;
}
.case-body .target-models .model-code:not(:last-child)::after{
  content:" / ";
  color:var(--sub);
  font-weight:400;
}
.case-body .case-img{
  margin-bottom:18px;
}
.case-body .case-img img{
  width:100%;
  height:auto;
  display:block;
  border-radius:var(--radius);
  border:1px solid var(--line);
}
.case-body .content{
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
}
.case-body .content-block{
  margin-bottom:16px;
}
.case-body .content-block:last-child{
  margin-bottom:0;
}
.case-body .content-block .content-label{
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}
.case-body .content-block .content-text{
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
}
</style>
</head>
<body>

<header class="top">
  <h1>차량 부위별 정비 사례</h1>
  <p>부위를 선택하면 관련 정비 사례를 확인할 수 있습니다</p>
</header>

<main id="home">
  <div class="panels">
    <div class="panel">
      <img src="assets/exterior.png" alt="외장 부위 안내">
      <div class="hotspots" id="hotspots-exterior"></div>
    </div>
    <div class="panel">
      <img src="assets/interior.png" alt="내장 부위 안내">
      <div class="hotspots" id="hotspots-interior"></div>
    </div>
    <div class="panel">
      <img src="assets/powertrain.png" alt="파워트레인 / 섀시 안내">
      <div class="hotspots" id="hotspots-powertrain"></div>
    </div>
  </div>
</main>

<div id="detail">
  <button class="back-btn" onclick="goHome()">처음 화면으로</button>
  <div class="detail-head">
    <div>
      <div class="eyebrow">정비 사례</div>
      <h2 id="detailTitle"></h2>
    </div>
  </div>
  <div class="case-list" id="caseList"></div>
</div>

<div id="caseDetail">
  <div class="back-row">
    <button class="back-btn" id="caseBackBtn">← 목록으로</button>
    <button class="back-btn" onclick="goHome()">처음 화면으로</button>
  </div>
  <div class="case-body">
    <h3 id="cdTitle"></h3>
    <div class="meta" id="cdMeta"></div>
    <div class="target-models" id="cdModels"></div>
    <div class="case-img" id="cdImg"></div>
    <div class="content" id="cdContent"></div>
  </div>
</div>

/* ========================================================

const COLS_INTERIOR = [
  [1.28, 17.63],
  [19.28, 38.28],
  [39.84, 59.03],
  [60.64, 78.50],
  [80.25, 97.73],
];

const ROWS_EXTERIOR = [
  [57.58, 76.33],
  [78.28, 96.69],
];
const ROWS_INTERIOR = [
  [59.71, 77.44],
  [79.40, 97.07],

// 파워트레인/섀시 이미지(교체본)에서 실측한 열(좌우) / 행(상하) 경계 (%)
const COLS_POWERTRAIN = [
  [2.39, 19.73],
  [21.78, 39.11],
  [41.16, 58.50],
  [60.55, 77.88],
  [79.93, 97.27],
];
const ROWS_POWERTRAIN = [
  [58.80, 76.60],
  [78.80, 96.40],
];

function rect(colIdx, rowIdx, group){
  let cols, rows;
  if(group === "exterior"){
    cols = COLS_EXTERIOR;
    rows = ROWS_EXTERIOR;
  } else if(group === "interior"){
    cols = COLS_INTERIOR;
    rows = ROWS_INTERIOR;
  } else {
    cols = COLS_POWERTRAIN;
    rows = ROWS_POWERTRAIN;
  }
  const [left, right] = cols[colIdx];
  const [top, bottom] = rows[rowIdx];
  return { left, top, width: right - left, height: bottom - top };
}

     models:     ["5시리즈(G60)", "X5(G05)"] (상세 화면에 "대상 차종"으로 파란색, 줄바꿈 후 표시됨),

======================================================== */

  bumper: [
    {

/* ========================================================
   렌더링
======================================================== */
function catById(id){ return CATEGORIES.find(c => c.id === id); }

function renderGrid(){
  const exWrap = document.getElementById("hotspots-exterior");
  const inWrap = document.getElementById("hotspots-interior");
  const ptWrap = document.getElementById("hotspots-powertrain");
  exWrap.innerHTML = "";
  inWrap.innerHTML = "";
  ptWrap.innerHTML = "";

  const wrapFor = { exterior: exWrap, interior: inWrap, powertrain: ptWrap };

  CATEGORIES.filter(cat => cat.rect).forEach(cat => {
    const btn = document.createElement("button");
    const count = (CASES[cat.id] || []).length;
    btn.className = "hotspot";
    btn.type = "button";
    btn.title = cat.name + (count > 0 ? ` (${count}건)` : "");
    btn.setAttribute("aria-label", cat.name);
    btn.style.left = cat.rect.left + "%";
    btn.style.top = cat.rect.top + "%";
    btn.style.width = cat.rect.width + "%";
    btn.style.height = cat.rect.height + "%";
    btn.onclick = () => openCategory(cat.id);
    wrapFor[cat.group].appendChild(btn);
  });
}
function openCategory(id){
  const cat = catById(id);
  if(!cat) return;

  document.getElementById("home").style.display = "none";
  document.getElementById("caseDetail").style.display = "none";
  document.getElementById("detail").style.display = "block";
  document.getElementById("detailTitle").textContent = cat.name;

  const list = CASES[id] || [];
  const listEl = document.getElementById("caseList");
  listEl.innerHTML = "";

  if(list.length === 0){
    listEl.innerHTML = `
      <div class="empty">
        <b>${cat.name}</b> 관련 등록된 정비 사례가 아직 없습니다.<br>
        정비 사례가 추가되면 이곳에 표시됩니다.
      </div>`;
  } else {
    list.forEach((c, idx) => {
      const item = document.createElement("div");
      item.className = "case-item";
      item.onclick = () => openCase(id, idx);
      item.innerHTML = `
        <div class="c-title">${c.title}</div>
        <div class="c-date">${c.date || ""}</div>
      `;
      listEl.appendChild(item);
    });
  }

  history.pushState(null, "", "#/" + id);
  window.scrollTo(0,0);
}

function openCase(catId, idx){
  const cat = catById(catId);
  const c = (CASES[catId] || [])[idx];
  if(!cat || !c) return;

  document.getElementById("detail").style.display = "none";
  document.getElementById("caseDetail").style.display = "block";
  document.getElementById("cdTitle").textContent = c.detailTitle || c.title;
  document.getElementById("cdMeta").textContent = `${cat.name}` + (c.date ? " · " + c.date : "");

  const modelsWrap = document.getElementById("cdModels");
  if(c.models && c.models.length){
    modelsWrap.style.display = "block";
    modelsWrap.innerHTML = `<span class="label">대상 차종</span>` +
      c.models.map(m => `<span class="model-code">${m}</span>`).join("");
  } else {
    modelsWrap.style.display = "none";
    modelsWrap.innerHTML = "";
  }

  const imgWrap = document.getElementById("cdImg");
  if(c.image){
    imgWrap.style.display = "block";
    imgWrap.innerHTML = `<img src="${c.image}" alt="첨부 이미지">`;
  } else {
    imgWrap.style.display = "none";
    imgWrap.innerHTML = "";
  }

  const contentWrap = document.getElementById("cdContent");
  if(c.symptom || c.action){
    contentWrap.innerHTML =
      (c.symptom ? `<div class="content-block"><div class="content-label">증상</div><div class="content-text">${c.symptom}</div></div>` : "") +
      (c.action ? `<div class="content-block"><div class="content-label">조치사항</div><div class="content-text">${c.action}</div></div>` : "");
  } else {
    contentWrap.textContent = c.content || "";
  }
  document.getElementById("caseBackBtn").onclick = () => openCategory(catId);

  history.pushState(null, "", "#/" + catId + "/" + idx);
  window.scrollTo(0,0);
}

function goHome(){
  document.getElementById("home").style.display = "block";
  document.getElementById("detail").style.display = "none";
  document.getElementById("caseDetail").style.display = "none";
  history.pushState(null, "", location.pathname + location.search);
  window.scrollTo(0,0);
}

function handleRoute(){
  const hash = location.hash.replace(/^#\//, "");
  if(!hash){ goHome(); return; }
  const parts = hash.split("/");
  if(parts.length === 1 && parts[0]){
    openCategory(parts[0]);
  } else if(parts.length === 2){
    openCategory(parts[0]);
    openCase(parts[0], parseInt(parts[1], 10));
  } else {
    goHome();
  }
}

window.addEventListener("popstate", handleRoute);
renderGrid();
handleRoute();
</script>

</body>
